id: e02
title: Retrieval quality — measured rerank depth, tenant-scale width, and a real type gate
wsjf: 9.0
status: planned

# Not sliced yet. The candidate outcomes below are what the evidence so far
# points at; `plan-work` turns them into stories and tasks.
notes: |
  Ranking, not embedding width, was the open quality lever, and it is now
  measured. Reranking lifts nDCG 71.2 -> 85.7 and hit@1 45.0% -> 67.5%; fusion
  alone trades precision for recall (recall 92.5 -> 97.5%, nDCG 71.2 -> 66.7%).
  `RETRIEVAL__RERANK_TOP_K` is 24, bit-identical to 50 on all 40 queries at
  half the p50. See ADR 0003 and specs/verifications/EVAL-retrieval-hybrid.md.

  Remaining candidate outcomes:

  1. Tenant-scale corpus run: settle 4096 vs 2048 vs 1B, and decide whether the
     lexical branch earns its keep once reranking is in place. On 112 chunks it
     did not (`dense-rerank@24` ranked identically to `hybrid-rerank@24`), but
     that corpus has no exact-identifier questions.
  2. Rerank latency: ~1.0 s at depth 24 dominates the request, against ~26-48 ms
     for retrieval. Self-hosted NIM, batching, or a smaller reranker is the next
     lever; fewer candidates is not (depth 12 already costs a query).
  3. CI has never executed: give the repository a remote so the workflow, which
     now includes basedpyright, actually runs.

