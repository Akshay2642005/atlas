id: e02
title: Retrieval quality — measured rerank depth, tenant-scale width, and a real type gate
wsjf: 9.0
status: planned

# Not sliced yet. The candidate outcomes below are what the evidence so far
# points at; `plan-work` turns them into stories and tasks.
notes: |
  Retrieval is now measured on two corpora, and the two open questions are
  answered.

  Width (8,990 chunks, 120 judged queries, ADR 0003): truncating 4096 -> 2048
  is a tie (-1.0 pp nDCG, interval -2.8 .. +0.6) and the 1B model is worse
  (-3.5 pp, interval -6.9 .. -0.2). Keep 4096 + 8B; nothing justifies a
  migration.

  Lexical branch (ADR 0004): it is a genuine trade-off, not a bug or a tuning
  problem. With reranking it costs 1.7 pp recall / 1.1 pp nDCG on generated
  questions (interval straddles zero) and gains 5.0 pp recall / 3.0 pp nDCG on
  exact-identifier queries. Retained.

  Remaining candidate outcomes:

  1. Rerank outage fallback: the retriever serves the *fused* order for five
     minutes when the reranker is unreachable, which is 19 pp nDCG worse than
     dense alone on 9k chunks. Serving the dense order instead would be
     strictly better, but it changes what ENABLE_RERANK=false means. Decide,
     then implement.
  2. Rerank latency: ~1.0 s at depth 24 dominates the request, against ~26-48 ms
     for retrieval. Self-hosted NIM, batching, or a smaller reranker is the next
     lever; fewer candidates is not (depth 12 already costs a query).
  3. Fusion quality: RRF's co-occurrence boost promotes mediocre dense
     candidates (28.8% of the rerank window is lexical-only). A promotion cap
     or document-level dedupe before fusion is the candidate fix; neither is
     measured.
  4. CI has never executed: give the repository a remote so the workflow, which
     now includes basedpyright, actually runs.

