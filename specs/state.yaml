    last_step_completed: "e03s01 done: `ContentStorePort` plus one `obstore` adapter covering S3/RustFS/MinIO, GCS, and a local directory, wired into both DI containers. Keys are tenant-scoped and content-addressed, staging keys are not, and presigning raises `StorageCapabilityError` on local instead of returning a URL that cannot work. Verified against a real RustFS, not just the compatibility claim: the same 14-case contract suite passes on `LocalStore` and on RustFS, and a presigned GET/PUT round-trip worked through plain urllib. Committed as 0190a5e (code) and 408dd1b (specs).\n\nBefore that: fixed BUG-008 (a failed ingest is now retryable), and measured retrieval on a 9k-chunk public-docs corpus (929 documents, 8,990 chunks) with 120 generated questions and 60 exact-identifier queries. Settled both open questions in ADR 0004 — keep 4096 + the 8B embedder (2048 truncation is a tie, the 1B is -3.5 pp nDCG), and keep the lexical branch (costs 1.7 pp recall on questions, gains 5.0 pp on exact identifiers, once reranked).\n\nNext is e03s02: the `blobs` / `document_versions` / `head_version_id` schema, migration 0004, and a content-addressed backfill from `document_contents` with `--verify` before the column is dropped. The retrieval oracle for e03s03 is identical recall/nDCG on `atlas-eval-docs`."
